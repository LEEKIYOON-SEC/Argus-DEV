name: Argus Maintenance

on:
  #schedule:
    #- cron: '40 3 * * 0'
  workflow_dispatch:
    inputs:
      task:
        description: '실행할 작업'
        type: choice
        default: 'package-index'
        options:
          - package-index
          - rule-index
          - backfill-vendors
          - backfill-exploited
          - backfill-cvss
          - turso-check
          - nvd-check
          - seed-turso
          - seed-verify
          - backfill-translations
      dry_run:
        description: 'backfill-cvss: 계산만 하고 저장하지 않기'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: argus-pipeline
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.upload.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build package index
        if: ${{ github.event_name == 'schedule' || inputs.task == 'package-index' }}
        env:
          ARGUS_STORE: turso
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python src/build_package_index.py

      - name: Build detection rule index
        if: ${{ github.event_name == 'schedule' || inputs.task == 'rule-index' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python src/build_rule_index.py

      - name: Backfill currently exploited (KEV)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'backfill-exploited' }}
        env:
          ARGUS_STORE: turso
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
          BACKFILL_LIMIT: '800'
        run: python src/backfill_exploited.py

      - name: Backfill CVSS versions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'backfill-cvss' }}
        env:
          ARGUS_STORE: turso
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          BACKFILL_CVSS_LIMIT: '1500'
          BACKFILL_CVSS_NVD_BUDGET: '2400'
        run: python src/backfill_cvss.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Check Turso connection and apply schema
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'turso-check' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python src/turso_check.py

      - name: Check NVD API key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'nvd-check' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python src/nvd_check.py

      - name: Seed Turso from source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'seed-turso' }}
        env:
          ARGUS_STORE: turso
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
          SEED_T1_MIN_YEAR: '2024'
        run: python src/seed_turso.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Verify seed before cutover
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'seed-verify' }}
        env:
          ARGUS_STORE: turso
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
          SEED_T1_MIN_YEAR: '2024'
        run: python src/seed_verify.py

      - name: Backfill Korean translations (Gemma only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'backfill-translations' }}
        env:
          ARGUS_STORE: turso
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ARGUS_TRANSLATION_MODELS: gemma
          ARGUS_TRANSLATION_MINUTES: '8'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/backfill_translations.py

      - name: Backfill affected vendors
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task == 'backfill-vendors') }}
        continue-on-error: true
        env:
          ARGUS_STORE: turso
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python src/backfill_vendors.py

      - name: Carry forward published data
        id: carry
        if: ${{ github.event_name == 'schedule' || inputs.task == 'package-index' || inputs.task == 'rule-index' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARGUS_FRESH_FILES: cve-packages.json,detection-rules.json
        run: python src/fetch_published.py

      - name: Set up Node
        if: ${{ steps.carry.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build CVE context
        if: ${{ steps.carry.outcome == 'success' }}
        continue-on-error: true
        run: node src/build_context.js

      # 화면 · 파이프라인 코드의 문법을 확인한다. 깨진 파일이 있으면 산출물을 올리지 않아 배포를 건너뛴다(직전 사이트가 그대로 남는다).
      - name: Check code syntax
        id: syntax
        if: ${{ steps.carry.outcome == 'success' }}
        run: python src/check_syntax.py

      - name: Upload Pages artifact
        id: upload
        if: ${{ steps.syntax.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: maintenance
    if: ${{ needs.maintenance.outputs.artifact == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
