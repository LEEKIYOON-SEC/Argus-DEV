name: Argus Fast Lane

on:
  #schedule:
    #- cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: argus-fast
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 키가 이미 있으면 actions/cache 는 다시 저장하지 않는다. 날짜 키로는 그날 첫 실행의 파일만 남아
      # 수명이 1~6시간인 캐시(KEV · EPSS)를 남은 하루 동안 매 실행 다시 받았다 — 시간 단위로 저장한다.
      - name: Resolve cache hour
        id: cacheday
        run: echo "day=$(date -u +%Y-%m-%d-%H)" >> "$GITHUB_OUTPUT"

      - name: Cache signal indexes
        uses: actions/cache@v4
        with:
          path: .cache/rulesets
          key: signals-fast-${{ steps.cacheday.outputs.day }}
          restore-keys: |
            signals-fast-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast lane
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARGUS_STORE: turso
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
        run: python src/fast_lane.py
